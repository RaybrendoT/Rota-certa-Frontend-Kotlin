# CI/CD do app Android (Kotlin/Compose).
#
#   PR e push → testes unitários e APK de debug (para baixar em "Artifacts" da execução).
#   tag v*    → APK e AAB de release assinados, apontando para a produção, publicados como
#               Release no GitHub (ex.: git tag v2.1.0 && git push origin v2.1.0).
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   MAPS_API_KEY                     chave do Maps SDK for Android;
#   KEYSTORE_BASE64                  keystore de release em base64 (base64 -w0 release.jks);
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Variável opcional (aba Variables): API_BASE_URL (padrão https://rotacerta-api.rest/api/).
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://rotacerta-api.rest/api/' }}
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

jobs:
  build:
    name: Testes e APK de debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários e build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Release assinado
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: APK e AAB de release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
